              // ---------- wallpaper ----------
              private fun presetBitmap(i: Int, w: Int, h: Int): Bitmap {
                  val p = PRESETS[i]
                  val bm = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val c = Canvas(bm)
                  c.drawColor(p[0])
                  val pt = Paint(Paint.ANTI_ALIAS_FLAG)
                  val xs = floatArrayOf(.1f, .95f, .1f, .9f)
                  val ys = floatArrayOf(.12f, .4f, .95f, .88f)
                  val rs = floatArrayOf(.85f, .8f, .9f, .6f)
                  for (k in 0..3) {
                      val cx = xs[k] * w
                      val cy = ys[k] * h
                      val r = rs[k] * w
                      pt.shader = RadialGradient(cx, cy, r, p[k + 1], p[k + 1] and 0x00FFFFFF, Shader.TileMode.CLAMP)
                      c.drawCircle(cx, cy, r, pt)
                  }
                  return bm
              }

              private fun cover(src: Bitmap, w: Int, h: Int): Bitmap {
                  val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val sc = maxOf(w / src.width.toFloat(), h / src.height.toFloat())
                  val dw = src.width * sc
                  val dh = src.height * sc
                  Canvas(out).drawBitmap(src, null, RectF((w - dw) / 2f, (h - dh) / 2f, (w + dw) / 2f, (h + dh) / 2f), Paint(Paint.FILTER_BITMAP_FLAG))
                  return out
              }

              private fun blur(b: Bitmap): Bitmap {
                  var x = b
                  val target = maxOf(b.width / 28, 16)
                  while (x.width / 2 >= target) x = Bitmap.createScaledBitmap(x, x.width / 2, maxOf(x.height / 2, 1), true)
                  return x
              }

              private fun applyWallpaper() {
                  val wp = prefs.getString("wp", "p0") ?: "p0"
                  var loaded: Bitmap? = null
                  if (wp == "file") {
                      val f = File(filesDir, "wallpaper.jpg")
                      if (f.exists()) loaded = BitmapFactory.decodeFile(f.path)
                  }
                  val idx = if (wp.startsWith("p")) (wp.substring(1).toIntOrNull() ?: 0).coerceIn(0, 3) else 0
                  val src = loaded ?: presetBitmap(idx, W, H)
                  val full = cover(src, W, H)
                  wall.setImageBitmap(full)
                  GlassLayout.blurred = blur(full)
                  GlassLayout.srcW = W
                  GlassLayout.srcH = H
                  invalidateGlass(root)
              }

              private fun setGallery(uri: Uri) {
                  try {
                      val o = BitmapFactory.Options()
                      o.inJustDecodeBounds = true
                      contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, o) }
                      var ss = 1
                      while (o.outWidth / ss > W * 2 || o.outHeight / ss > H * 2) ss *= 2
                      val o2 = BitmapFactory.Options()
                      o2.inSampleSize = ss
                      val bm = contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, o2) }
                      if (bm == null) throw Exception("decode")
                      File(filesDir, "wallpaper.jpg").outputStream().use { bm.compress(Bitmap.CompressFormat.JPEG, 92, it) }
                      prefs.edit().putString("wp", "file").apply()
                      applyWallpaper()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Could not load image", Toast.LENGTH_SHORT).show()
                  }
              }
          }
